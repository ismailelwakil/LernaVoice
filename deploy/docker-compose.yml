# LERNA Voice AI — production deploy.
# Run from anywhere:  docker compose -f deploy/docker-compose.yml up --build -d
# The build context is the repo root (the folder holding app/ and Dockerfile).
services:
  voice-ai:
    build:
      context: ..            # repo root
      dockerfile: Dockerfile
    image: lerna-voice-ai:latest
    container_name: lerna-voice-ai
    restart: unless-stopped
    env_file:
      - ../.env              # copy deploy/.env.production.example → ../.env and fill it
    environment:
      APP_ENV: production
      PORT: "8080"
      VOICE_AUTH_REQUIRED: "true"
      EXPOSE_DEV_DIAGNOSTICS: "false"
      WEB_CONCURRENCY: "1"   # stateful sessions → one worker; scale with sticky sessions
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Uncomment to mount a Vertex service-account key read-only:
    # volumes:
    #   - ../secrets/sa.json:/secrets/sa.json:ro
